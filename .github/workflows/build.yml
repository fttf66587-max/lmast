name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q project.zip -d proj
      - name: fix sword
        run: |
          sed -i 's/new Item.Settings().sword(ToolMaterial.IRON, 4f, -2.4f)/ToolMaterial.IRON.applySwordSettings(new Item.Settings(), 4f, -2.4f)/' $(find proj -name ModItems.java)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: strangerthings-mod
          path: proj/build/libs/*.jar
